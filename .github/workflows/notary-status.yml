name: Estado de notarización

# Consulta en la API de notarización de Apple (en Linux, barato) los últimos envíos y, con
# `id`, el registro de uno. Sirve para esperar la primera notarización de la cuenta, que
# puede tardar horas, sin tener ocupada una máquina macOS.

on:
  # Al cambiar este archivo sólo lista (y así GitHub registra el workflow fuera de main).
  push:
    paths: [".github/workflows/notary-status.yml"]
  workflow_dispatch:
    inputs:
      id:
        description: "Id del envío (vacío = sólo listar los últimos)"
        required: false
        default: ""

permissions:
  contents: read

jobs:
  status:
    runs-on: ubuntu-latest
    steps:
      - run: pip install --quiet "pyjwt[crypto]==2.10.1"
      - name: Consultar
        env:
          ASC_PRIVATE_KEY: ${{ secrets.ASC_PRIVATE_KEY }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ID: ${{ inputs.id }}
        shell: python
        run: |
          import json, os, time, urllib.request
          import jwt

          now = int(time.time())
          token = jwt.encode(
              {"iss": os.environ["ASC_ISSUER_ID"], "iat": now, "exp": now + 600,
               "aud": "appstoreconnect-v1"},
              os.environ["ASC_PRIVATE_KEY"], algorithm="ES256",
              headers={"kid": os.environ["ASC_KEY_ID"], "typ": "JWT"})
          base = "https://appstoreconnect.apple.com/notary/v2/submissions"

          def get(url):
              req = urllib.request.Request(url, headers={"Authorization": f"Bearer {token}"})
              with urllib.request.urlopen(req) as r:
                  return json.load(r)

          print("Últimos envíos:")
          for s in get(base)["data"][:10]:
              a = s["attributes"]
              print(f'  {s["id"]}  {a["status"]:<12} {a["createdDate"]}  {a["name"]}')

          sid = os.environ.get("ID", "").strip()
          if sid:
              a = get(f"{base}/{sid}")["data"]["attributes"]
              print(f"\n{sid}: {a['status']}")
              if a["status"] in ("Accepted", "Invalid", "Rejected"):
                  url = get(f"{base}/{sid}/logs")["data"]["attributes"]["developerLogUrl"]
                  with urllib.request.urlopen(url) as r:
                      print(json.dumps(json.load(r), indent=2, ensure_ascii=False))
