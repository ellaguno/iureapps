name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-x64
            os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            bin: iureapps
          - name: windows-x64
            os: windows-latest
            target: x86_64-pc-windows-msvc
            bin: iureapps.exe
          - name: macos-arm64
            os: macos-latest
            target: aarch64-apple-darwin
            bin: iureapps
          - name: macos-x64
            os: macos-latest
            target: x86_64-apple-darwin
            bin: iureapps
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
          components: clippy, rustfmt
      - uses: swatinem/rust-cache@v2
      - name: Dependencias de Linux (llavero por D-Bus)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libdbus-1-dev pkg-config
      - name: Formato y clippy
        if: matrix.name == 'linux-x64'
        run: |
          cargo fmt --check
          cargo clippy --target ${{ matrix.target }} -- -D warnings
      - name: Pruebas
        if: matrix.name != 'macos-x64'
        run: cargo test --target ${{ matrix.target }}
      - name: Compilar
        run: cargo build --release --target ${{ matrix.target }}
      - name: Renombrar
        shell: bash
        run: |
          mkdir -p dist
          ext=""; [[ "${{ matrix.bin }}" == *.exe ]] && ext=".exe"
          cp "target/${{ matrix.target }}/release/${{ matrix.bin }}" "dist/iureapps-${{ matrix.name }}${ext}"
          ls -la dist
      - uses: actions/upload-artifact@v4
        with:
          name: iureapps-${{ matrix.name }}
          path: dist/*
      - name: Publicar en la release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 || gh release create "$GITHUB_REF_NAME" --title "Iurefficient Apps $GITHUB_REF_NAME" --generate-notes || true
          gh release upload "$GITHUB_REF_NAME" dist/* --clobber
