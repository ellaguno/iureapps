name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:
    inputs:
      release:
        description: "Versión a publicar (p. ej. v0.1.0); vacío = sólo compilar"
        required: false
        default: ""

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-x64
            os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            bin: iureapps
          - name: windows-x64
            os: windows-latest
            target: x86_64-pc-windows-msvc
            bin: iureapps.exe
          # Las dos de macOS en la máquina Intel: a las arm64 de macos-latest a menudo no les toca
          # máquina. La de arm64 se compila cruzada (sin pruebas).
          - name: macos-arm64
            os: macos-15-intel
            target: aarch64-apple-darwin
            bin: iureapps
          - name: macos-x64
            os: macos-15-intel
            target: x86_64-apple-darwin
            bin: iureapps
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
          components: clippy, rustfmt
      - uses: swatinem/rust-cache@v2
      - name: Dependencias de Linux (llavero por D-Bus)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libdbus-1-dev pkg-config
      - name: Formato y clippy
        if: matrix.name == 'linux-x64'
        run: |
          cargo fmt --check
          cargo clippy --target ${{ matrix.target }} -- -D warnings
      - name: Pruebas
        if: matrix.name != 'macos-arm64'
        run: cargo test --target ${{ matrix.target }}
      - name: Compilar
        run: cargo build --release --target ${{ matrix.target }}
      - name: Renombrar
        shell: bash
        run: |
          mkdir -p dist
          bin="target/${{ matrix.target }}/release/${{ matrix.bin }}"
          if [[ "${{ matrix.bin }}" == *.exe ]]; then
            cp "$bin" "dist/iureapps-${{ matrix.name }}.exe"
          else
            # tar.gz conserva el permiso de ejecución (los artefactos lo pierden).
            tar -czf "dist/iureapps-${{ matrix.name }}.tar.gz" -C "$(dirname "$bin")" iureapps
          fi
          ls -la dist
      - name: Instaladores de Windows (.msi y -setup.exe)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          # MSI y NSIS sólo aceptan versiones numéricas: sin el sufijo «-alpha…».
          $version = (Select-String -Path Cargo.toml -Pattern '^version = "([^"]+)"' | Select-Object -First 1).Matches.Groups[1].Value
          $version = $version -replace '-.*$', ''
          $exe = (Resolve-Path "target/${{ matrix.target }}/release/iureapps.exe").Path
          $dist = (Resolve-Path dist).Path

          # .msi para todos los usuarios (Archivos de programa), con WiX 5.
          dotnet tool install --global wix --version 5.0.2
          wix build assets/windows/iureapps.wxs -arch x64 -d "Version=$version" -d "Exe=$exe" -o "$dist/iureapps-windows-x64.msi"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          # Símbolos de depuración del .msi: no van al release.
          Remove-Item "$dist/*.wixpdb" -ErrorAction SilentlyContinue

          # -setup.exe por usuario (sin administrador; se autoactualiza sin pedir permisos), con NSIS.
          $makensis = "${env:ProgramFiles(x86)}\NSIS\makensis.exe"
          if (-not (Test-Path $makensis)) {
            choco install nsis -y --no-progress
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
          & $makensis "/DVERSION=$version" "/DEXE=$exe" "/DOUTFILE=$dist\iureapps-windows-x64-setup.exe" assets\windows\iureapps.nsi
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Get-ChildItem dist
      - name: Herramientas de empaquetado (Linux)
        if: runner.os == 'Linux'
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-deb,cargo-generate-rpm
      - name: Paquetes .deb y .rpm
        if: runner.os == 'Linux'
        run: |
          # La metadata de Cargo.toml apunta a target/release/iureapps.
          mkdir -p target/release
          cp "target/${{ matrix.target }}/release/iureapps" target/release/iureapps
          cargo deb --no-build --no-strip --output dist/
          cargo generate-rpm --output dist/
          ls -la dist
      - uses: actions/upload-artifact@v4
        with:
          name: iureapps-${{ matrix.name }}
          path: dist/*

  # Release: al subir una etiqueta v* o al lanzar el workflow a mano con `release`.
  # GitHub crea la etiqueta sobre el commit compilado si todavía no existe.
  publish:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v') || inputs.release != ''
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Sumas y firmas
        env:
          # Opcional: clave de `tauri signer generate` (su .pub va en PUBKEY de src/selfupdate.rs).
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.IUREAPPS_SIGNING_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.IUREAPPS_SIGNING_KEY_PASSWORD }}
        run: |
          cd dist
          # La autoactualización comprueba cada descarga contra SHA256SUMS.
          sha256sum -- * > SHA256SUMS
          cat SHA256SUMS
          if [ -n "$TAURI_SIGNING_PRIVATE_KEY" ]; then
            for f in *; do
              [ "$f" = SHA256SUMS ] && continue
              npx --yes @tauri-apps/cli@2 signer sign "$f"
            done
          else
            echo "Sin IUREAPPS_SIGNING_KEY: el release sale sin firmas .sig"
          fi
          ls -la
      - name: Publicar
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ inputs.release != '' && inputs.release || github.ref_name }}
        run: |
          ls -la dist
          gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 || \
            gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
              --title "Iurefficient Apps ${TAG#v}" --generate-notes
          gh release upload "$TAG" dist/* --repo "$GITHUB_REPOSITORY" --clobber
