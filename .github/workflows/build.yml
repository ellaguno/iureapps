name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:
    inputs:
      release:
        description: "Versión a publicar (p. ej. v0.1.0); vacío = sólo compilar"
        required: false
        default: ""

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-x64
            os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            bin: iureapps
          - name: windows-x64
            os: windows-latest
            target: x86_64-pc-windows-msvc
            bin: iureapps.exe
          # Las dos de macOS en la máquina Intel: a las arm64 de macos-latest a menudo no les toca
          # máquina. La de arm64 se compila cruzada (sin pruebas).
          - name: macos-arm64
            os: macos-15-intel
            target: aarch64-apple-darwin
            bin: iureapps
          - name: macos-x64
            os: macos-15-intel
            target: x86_64-apple-darwin
            bin: iureapps
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: La etiqueta coincide con la versión de Cargo.toml
        if: startsWith(github.ref, 'refs/tags/v') || inputs.release != ''
        env:
          TAG: ${{ inputs.release != '' && inputs.release || github.ref_name }}
        shell: bash
        run: |
          version=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)
          if [[ "${TAG#v}" != "$version" ]]; then
            echo "::error::La etiqueta $TAG no coincide con Cargo.toml ($version): sube la versión antes de etiquetar."
            exit 1
          fi
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
          components: clippy, rustfmt
      - uses: swatinem/rust-cache@v2
      - name: Dependencias de Linux (llavero por D-Bus)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libdbus-1-dev pkg-config
      - name: Formato y clippy
        if: matrix.name == 'linux-x64'
        run: |
          cargo fmt --check
          cargo clippy --target ${{ matrix.target }} -- -D warnings
      - name: Pruebas
        if: matrix.name != 'macos-arm64'
        run: cargo test --target ${{ matrix.target }}
      - name: Compilar
        run: cargo build --release --target ${{ matrix.target }}
      - name: Renombrar
        shell: bash
        run: |
          mkdir -p dist
          bin="target/${{ matrix.target }}/release/${{ matrix.bin }}"
          if [[ "${{ matrix.bin }}" == *.exe ]]; then
            cp "$bin" "dist/iureapps-${{ matrix.name }}.exe"
          else
            # tar.gz conserva el permiso de ejecución (los artefactos lo pierden).
            tar -czf "dist/iureapps-${{ matrix.name }}.tar.gz" -C "$(dirname "$bin")" iureapps
          fi
          ls -la dist
      # Paquete para Microsoft Store (la Store lo firma). La identidad sale de Partner Center
      # (Identidad del producto) y va en variables del repo; sin ellas se usan valores de prueba.
      # Además, una copia firmada con un certificado de prueba para instalarla a mano y probar.
      - name: Paquete MSIX (Microsoft Store)
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          MSIX_IDENTITY_NAME: ${{ vars.MSIX_IDENTITY_NAME }}
          MSIX_PUBLISHER: ${{ vars.MSIX_PUBLISHER }}
          MSIX_PUBLISHER_DISPLAY_NAME: ${{ vars.MSIX_PUBLISHER_DISPLAY_NAME }}
        run: |
          $ErrorActionPreference = 'Stop'
          if (-not $env:MSIX_IDENTITY_NAME -or -not $env:MSIX_PUBLISHER -or -not $env:MSIX_PUBLISHER_DISPLAY_NAME) {
            Write-Output "::warning::Faltan las variables MSIX_IDENTITY_NAME, MSIX_PUBLISHER o MSIX_PUBLISHER_DISPLAY_NAME: el .msix lleva una identidad de prueba y Partner Center lo rechazará."
          }
          $identity = if ($env:MSIX_IDENTITY_NAME) { $env:MSIX_IDENTITY_NAME } else { 'Iurefficient.IurefficientApps' }
          $publisher = if ($env:MSIX_PUBLISHER) { $env:MSIX_PUBLISHER } else { 'CN=Iurefficient' }
          $display = if ($env:MSIX_PUBLISHER_DISPLAY_NAME) { $env:MSIX_PUBLISHER_DISPLAY_NAME } else { 'Iurefficient' }
          # La Store no acepta un primer número 0 y exige el cuarto en 0: 0.1.17 → 1.1.17.0
          # (igual que IureProject). Siempre crece; la 1.0.0 será 2.0.0.0.
          $cargo = (Select-String -Path Cargo.toml -Pattern '^version = "([^"]+)"' | Select-Object -First 1).Matches.Groups[1].Value
          $parts = ($cargo -replace '-.*$', '').Split('.')
          $version = "$([int]$parts[0] + 1).$($parts[1]).$($parts[2]).0"
          Write-Output "Versión del paquete: $version"
          # Los valores van dentro de atributos XML.
          $identity = [System.Security.SecurityElement]::Escape($identity)
          $publisher = [System.Security.SecurityElement]::Escape($publisher)
          $display = [System.Security.SecurityElement]::Escape($display)

          $sdk = Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\bin" -Directory |
            Where-Object { $_.Name -match '^10\.' -and (Test-Path "$($_.FullName)\x64\makeappx.exe") } |
            Sort-Object { [version]$_.Name } -Descending | Select-Object -First 1
          $tools = "$($sdk.FullName)\x64"
          Write-Output "Windows SDK: $tools"

          $root = 'msix\paquete'
          New-Item -ItemType Directory -Force $root, msix\store, msix\prueba | Out-Null
          Copy-Item -Recurse assets\windows\msix\Assets "$root\Assets"
          Copy-Item "target\${{ matrix.target }}\release\iureapps.exe" "$root\iureapps.exe"
          $manifest = Get-Content assets\windows\msix\AppxManifest.xml -Raw
          $manifest = $manifest.Replace('@IDENTITY_NAME@', $identity).Replace('@PUBLISHER@', $publisher)
          $manifest = $manifest.Replace('@PUBLISHER_DISPLAY_NAME@', $display).Replace('@VERSION@', $version)
          Set-Content "$root\AppxManifest.xml" $manifest -Encoding utf8

          # resources.pri: elige los iconos sin fondo (altform-unplated) de la barra de tareas.
          & "$tools\makepri.exe" createconfig /cf msix\priconfig.xml /dq es-MX /o
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & "$tools\makepri.exe" new /pr $root /cf msix\priconfig.xml /mn "$root\AppxManifest.xml" /of "$root\resources.pri" /o
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & "$tools\makeappx.exe" pack /d $root /p msix\store\iureapps-windows-x64.msix /o
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

          # Copia de prueba: certificado autofirmado con el mismo Publisher.
          $cert = New-SelfSignedCertificate -Type Custom -Subject $publisher -KeyUsage DigitalSignature `
            -FriendlyName 'Iurefficient Apps (prueba)' -CertStoreLocation Cert:\CurrentUser\My `
            -TextExtension @('2.5.29.37={text}1.3.6.1.5.5.7.3.3', '2.5.29.19={text}')
          $pass = ConvertTo-SecureString -String 'prueba' -Force -AsPlainText
          Export-PfxCertificate -Cert $cert -FilePath msix\prueba.pfx -Password $pass | Out-Null
          Export-Certificate -Cert $cert -FilePath msix\prueba\iureapps-prueba.cer | Out-Null
          Copy-Item msix\store\iureapps-windows-x64.msix msix\prueba\iureapps-windows-x64-prueba.msix
          & "$tools\signtool.exe" sign /fd SHA256 /f msix\prueba.pfx /p prueba msix\prueba\iureapps-windows-x64-prueba.msix
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Remove-Item msix\prueba.pfx

          # Prueba: instalar la copia firmada, abrir la CLI por su alias y desinstalar.
          Import-Certificate -FilePath msix\prueba\iureapps-prueba.cer -CertStoreLocation Cert:\LocalMachine\TrustedPeople | Out-Null
          Add-AppxPackage -Path msix\prueba\iureapps-windows-x64-prueba.msix
          $pkg = Get-AppxPackage | Where-Object { $_.Name -eq $identity -or $_.Name -eq 'Iurefficient.IurefficientApps' } | Select-Object -First 1
          Write-Output "Instalado: $($pkg.PackageFullName)"
          $alias = "$env:LOCALAPPDATA\Microsoft\WindowsApps\iureapps.exe"
          $fallos = @()
          try {
            $out = & $alias --version 2>&1
            Write-Output "iureapps --version (alias): $out"
            if ("$out" -notmatch 'iureapps') { $fallos += 'La CLI no respondió dentro del paquete MSIX' }

            # Sin virtualización desactivada: lo que lanza el paquete fuera del contenedor debe
            # quedar en el HKCU y el AppData reales (esta sesión de PowerShell no está empaquetada).
            $clave = 'HKCU:\Software\Iurefficient\PruebaMsix'
            $cuenta = "$env:APPDATA\iurefficient\cuenta-activa.json"
            $virtual = "$env:LOCALAPPDATA\Packages\$($pkg.PackageFamilyName)\LocalCache"
            if (Test-Path $cuenta) { throw "Ya hay una cuenta activa en $cuenta" }
            $out = & $alias interno-prueba-msix escribir 2>&1
            $code = $LASTEXITCODE
            $out | ForEach-Object { Write-Output "  $_" }
            if ($code -ne 0) { $fallos += "interno-prueba-msix escribir terminó con $code" }
            Start-Sleep -Seconds 3  # la escritura «Abierta» no se espera
            $valores = Get-ItemProperty -Path $clave -ErrorAction SilentlyContinue
            foreach ($v in 'Fuera', 'Instalador', 'Abierta') {
              if ($valores.$v -eq 'ok') { Write-Output "HKCU real tiene PruebaMsix\$v" }
              else { $fallos += "No quedó PruebaMsix\$v en el HKCU real" }
            }
            if ($valores.Dentro -eq 'ok') {
              Write-Output "Nota: en este Windows lo que el paquete escribe en HKCU desde dentro también llega al registro real"
            } else { Write-Output "Control: lo escrito en HKCU dentro del paquete quedó virtualizado" }
            if (Test-Path $cuenta) {
              $json = Get-Content $cuenta -Raw | ConvertFrom-Json
              Write-Output "cuenta-activa.json real: $($json.domain) $($json.email) ($($json.app))"
              if ($json.domain -ne 'prueba-msix.invalid') { $fallos += 'cuenta-activa.json real con otro dominio' }
            } else { $fallos += "cuenta-activa.json no quedó en $cuenta" }
            $copia = Get-ChildItem -Recurse -Path $virtual -Filter cuenta-activa.json -ErrorAction SilentlyContinue
            if ($copia) { $fallos += "cuenta-activa.json quedó virtualizado en $($copia.FullName)" }

            $out = & $alias interno-prueba-msix borrar 2>&1
            $code = $LASTEXITCODE
            $out | ForEach-Object { Write-Output "  $_" }
            if ($code -ne 0) { $fallos += "interno-prueba-msix borrar terminó con $code" }
            if (Test-Path $cuenta) { $fallos += 'cuenta-activa.json real no se borró al desconectar' }
            else { Write-Output 'cuenta-activa.json real borrado desde el paquete' }
          } finally {
            Remove-Item -Path 'HKCU:\Software\Iurefficient\PruebaMsix' -Recurse -ErrorAction SilentlyContinue
            Remove-AppxPackage -Package $pkg.PackageFullName
          }
          foreach ($f in $fallos) { Write-Output "::error::$f" }
          if ($fallos.Count -gt 0) { exit 1 }
          Get-ChildItem msix\store, msix\prueba
      - name: Subir el MSIX para la Store
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: msix-store
          path: msix/store/*
      - name: Subir el MSIX de prueba
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: msix-prueba
          path: msix/prueba/*
      - name: Herramientas de empaquetado (Linux)
        if: runner.os == 'Linux'
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-deb,cargo-generate-rpm
      - name: Paquetes .deb y .rpm
        if: runner.os == 'Linux'
        run: |
          # La metadata de Cargo.toml apunta a target/release/iureapps.
          mkdir -p target/release
          cp "target/${{ matrix.target }}/release/iureapps" target/release/iureapps
          cargo deb --no-build --no-strip --output dist/
          cargo generate-rpm --output dist/
          ls -la dist
      - uses: actions/upload-artifact@v4
        with:
          name: iureapps-${{ matrix.name }}
          path: dist/*

  # Release: al subir una etiqueta v* o al lanzar el workflow a mano con `release`.
  # GitHub crea la etiqueta sobre el commit compilado si todavía no existe.
  publish:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v') || inputs.release != ''
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          # Sólo los binarios del lanzador; los MSIX (msix-*) no van a la release.
          pattern: iureapps-*
          merge-multiple: true
      # Misma clave del actualizador de Tauri que iureditor, IureTranscribe e IureDav: el
      # lanzador verifica estas firmas antes de actualizarse solo (src/selfupdate.rs).
      - name: Firmar (minisign, clave del actualizador)
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          if [[ -z "$TAURI_SIGNING_PRIVATE_KEY" ]]; then
            echo "::warning::Falta el secret TAURI_SIGNING_PRIVATE_KEY: la release sale sin firmas y el lanzador no podrá actualizarse solo."
            exit 0
          fi
          for f in dist/*; do
            [[ "$f" == *.sig ]] && continue
            npx --yes @tauri-apps/cli@2 signer sign "$f"
          done
          ls -la dist
      - name: Publicar
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ inputs.release != '' && inputs.release || github.ref_name }}
        run: |
          ls -la dist
          # macos.yml puede estar creando la misma release a la vez: se reintenta.
          for i in 1 2 3 4 5; do
            gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 && break
            gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
              --title "Iurefficient Apps ${TAG#v}" --generate-notes && break
            sleep $((i * 10))
          done
          gh release upload "$TAG" dist/* --repo "$GITHUB_REPOSITORY" --clobber
