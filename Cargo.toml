[package]
name = "iureapps"
version = "0.1.0"
edition = "2021"
description = "Lanzador e instalador ligero de las apps de escritorio de Iurefficient"
license = "MIT"
repository = "https://github.com/ellaguno/iureapps"

[dependencies]
eframe = { version = "0.37", default-features = false, features = ["default_fonts", "glow", "wayland", "x11"] }
ureq = { version = "3.5", default-features = false, features = ["rustls", "platform-verifier", "json", "gzip"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
minisign-verify = "0.3"
base64 = "0.22"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true
